<html lang="en">
<head>
<meta charset="UTF-8">

<title>DSA Patterns Tracker</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1a1d23; --sub:#6b7280; --border:#e5e7eb;
  --accent:#4f46e5; --accent-light:#eef2ff; --done:#16a34a; --done-bg:#ecfdf5;
  --track-bg:#e5e7eb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#171a21; --text:#e8e9ec; --sub:#9198a8; --border:#282c36;
    --accent:#818cf8; --accent-light:#1e2140; --done:#4ade80; --done-bg:#0f2a1c;
    --track-bg:#282c36;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#171a21; --text:#e8e9ec; --sub:#9198a8; --border:#282c36;
  --accent:#818cf8; --accent-light:#1e2140; --done:#4ade80; --done-bg:#0f2a1c;
  --track-bg:#282c36;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100%;
}
.wrap{max-width:780px; margin:0 auto; padding:20px 16px 60px;}
header{position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5; padding:4px 0 12px;}
h1{font-size:1.4rem; margin:4px 0 2px;}
.tagline{color:var(--sub); font-size:.85rem; margin:0 0 14px;}
.overall{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:14px;}
.overall-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.overall-top .pct{font-weight:700; color:var(--accent); font-size:1.1rem;}
.bar{height:8px; background:var(--track-bg); border-radius:99px; overflow:hidden;}
.bar>span{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s;}
.controls{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
#search{flex:1; min-width:140px; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:.9rem;}
#search:focus{outline:2px solid var(--accent); outline-offset:-1px;}
.btn{padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:.85rem; cursor:pointer;}
.btn:active{transform:scale(.97);}
.pattern{background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden;}
.pattern-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; user-select:none;}
.pattern-head .chev{transition:transform .18s; color:var(--sub); flex-shrink:0;}
.pattern.open .chev{transform:rotate(90deg);}
.pattern-head .name{font-weight:600; font-size:.95rem; flex:1;}
.pattern-head .count{font-size:.78rem; color:var(--sub); white-space:nowrap;}
.mini-bar{height:5px; background:var(--track-bg); border-radius:99px; overflow:hidden; margin:0 14px 12px;}
.mini-bar>span{display:block; height:100%; background:var(--accent); border-radius:99px;}
.qlist{display:none; padding:0 6px 8px;}
.pattern.open .qlist{display:block;}
.q{display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:10px;}
.q:hover{background:var(--accent-light);}
.q input{margin-top:3px; width:17px; height:17px; accent-color:var(--accent); flex-shrink:0; cursor:pointer;}
.q label{flex:1; font-size:.88rem; line-height:1.35; cursor:pointer;}
.q.done label .qname{color:var(--done); text-decoration:line-through; text-decoration-color:var(--done);}
.qname{display:block; margin-bottom:2px;}
.links a{font-size:.76rem; color:var(--accent); text-decoration:none; margin-right:10px;}
.links a:hover{text-decoration:underline;}
.hidden{display:none !important;}
.empty{text-align:center; color:var(--sub); padding:30px 0; font-size:.9rem;}
footer{text-align:center; color:var(--sub); font-size:.75rem; margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🧩 DSA Patterns Tracker</h1>
  <p class="tagline">Tick off each question as you solve it — progress is saved on this device.</p>
  <div class="overall">
    <div class="overall-top"><span id="overallLabel">0 / 0 solved</span><span class="pct" id="overallPct">0%</span></div>
    <div class="bar"><span id="overallBarFill" style="width:0%"></span></div>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="Search a question or pattern…">
    <button class="btn" id="expandAll">Expand all</button>
    <button class="btn" id="collapseAll">Collapse all</button>
  </div>
</header>
<main id="list"></main>
<div class="empty hidden" id="emptyMsg">No questions match your search.</div>
<footer>Built from your DSA Patterns Cheat Sheet · data stays in your browser only</footer>
</div>

const STORE_KEY = 'dsa-tracker-solved-v1';
let solved = {};
try{ solved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }catch(e){ solved = {}; }

function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(solved)); }catch(e){} }

const list = document.getElementById('list');
let totalQ = 0, totalDone = 0;

DATA.forEach(([pname, qs], pi)=>{
  const patDiv = document.createElement('div');
  patDiv.className = 'pattern';
  patDiv.dataset.pattern = pname.toLowerCase();

  const head = document.createElement('div');
  head.className = 'pattern-head';
  head.innerHTML = `<span class="chev">▶</span><span class="name">${pname}</span><span class="count" data-count></span>`;
  head.addEventListener('click', ()=> patDiv.classList.toggle('open'));
  patDiv.appendChild(head);

  const miniBar = document.createElement('div');
  miniBar.className = 'mini-bar';
  miniBar.innerHTML = '<span data-minifill style="width:0%"></span>';
  patDiv.appendChild(miniBar);

  const qlist = document.createElement('div');
  qlist.className = 'qlist';

  qs.forEach(([qname, links], qi)=>{
    totalQ++;
    const id = 'q_'+pi+'_'+qi;
    const row = document.createElement('div');
    row.className = 'q';
    row.dataset.search = (qname + ' ' + pname).toLowerCase();
    const isDone = !!solved[id];
    if(isDone) totalDone++;
    if(isDone) row.classList.add('done');

    const linksHtml = links.length
      ? `<div class="links">${links.map((l,i)=>`<a href="${l}" target="_blank" rel="noopener">${links.length>1?'Link '+(i+1):'Solve ↗'}</a>`).join('')}</div>`
      : '';

    row.innerHTML = `<input type="checkbox" id="${id}" ${isDone?'checked':''}>
      <label for="${id}"><span class="qname">${qname}</span>${linksHtml}</label>`;

    row.querySelector('input').addEventListener('change', (e)=>{
      solved[id] = e.target.checked;
      row.classList.toggle('done', e.target.checked);
      save();
      updateCounts();
    });

    qlist.appendChild(row);
  });

  patDiv.appendChild(qlist);
  patDiv.dataset.total = qs.length;
  list.appendChild(patDiv);
});

function updateCounts(){
  let done=0, total=0;
  document.querySelectorAll('.pattern').forEach(patDiv=>{
    const rows = patDiv.querySelectorAll('.q');
    const t = rows.length;
    let d = 0;
    rows.forEach(r=>{ if(r.classList.contains('done')) d++; });
    total += t; done += d;
    patDiv.querySelector('[data-count]').textContent = `${d}/${t}`;
    const pct = t ? Math.round(d/t*100) : 0;
    patDiv.querySelector('[data-minifill]').style.width = pct + '%';
  });
  document.getElementById('overallLabel').textContent = `${done} / ${total} solved`;
  const opct = total ? Math.round(done/total*100) : 0;
  document.getElementById('overallPct').textContent = opct + '%';
  document.getElementById('overallBarFill').style.width = opct + '%';
}
updateCounts();

document.getElementById('search').addEventListener('input', (e)=>{
  const term = e.target.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.pattern').forEach(patDiv=>{
    let patternMatch = patDiv.dataset.pattern.includes(term);
    let hasVisibleQ = false;
    patDiv.querySelectorAll('.q').forEach(row=>{
      const match = term === '' || patternMatch || row.dataset.search.includes(term);
      row.classList.toggle('hidden', !match);
      if(match) hasVisibleQ = true;
    });
    patDiv.classList.toggle('hidden', !hasVisibleQ);
    if(hasVisibleQ){
      anyVisible = true;
      if(term !== '') patDiv.classList.add('open');
    }
  });
  document.getElementById('emptyMsg').classList.toggle('hidden', anyVisible || term==='');
});

document.getElementById('expandAll').addEventListener('click', ()=>{
  document.querySelectorAll('.pattern').forEach(p=>p.classList.add('open'));
});
document.getElementById('collapseAll').addEventListener('click', ()=>{
  document.querySelectorAll('.pattern').forEach(p=>p.classList.remove('open'));
});
</script>
